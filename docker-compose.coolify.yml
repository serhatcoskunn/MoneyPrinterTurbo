
services:
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - streamlit
      - run
      - ./webui/Main.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.enableCORS=False
      - --browser.gatherUsageStats=False
      - --client.toolbarMode=minimal
      - --logger.hideWelcomeMessage=True
      - --server.showEmailPrompt=False
    expose:
      - "8501"
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - python3
      - main.py
    expose:
      - "8080"
    restart: always
